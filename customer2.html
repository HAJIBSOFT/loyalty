        async function registerUser(event) {
            event.preventDefault();
            const name = document.getElementById('cust-name').value;
            const phone = document.getElementById('cust-phone').value;

            addLog("بدء عملية التسجيل للعميل: " + name);

            try {
                // 1. التحقق من وجود العميل مسبقاً بقاعدة البيانات
                addLog("الخطوة 1: جاري التحقق من وجود رقم الهاتف في قاعدة البيانات...");
                const { data: existingUser, error: checkError } = await supabaseClient
                    .from('loyalty_members')
                    .select('*')
                    .eq('phone_number', phone)
                    .maybeSingle();

                if (checkError) {
                    throw new Error("خطأ أثناء التحقق من قاعدة البيانات: " + checkError.message);
                }

                if (existingUser) {
                    addLog("العميل مسجل مسبقاً بالفعل في النظام.");
                    document.getElementById('wallet-download-link').href = existingUser.share_url;
                    document.getElementById('download-section').classList.remove('hidden');
                    addLog("تم إظهار رابط تحميل بطاقة العميل الحالية بنجاح.");
                    alert("أنت مسجل مسبقاً معنا! تفضل بتحميل بطاقتك الحالية.");
                    return;
                }

                addLog("الرقم جديد وغير مسجل مسبقاً. جاري المتابعة...");

                // 2. إرسال طلب لـ WalletWallet API
                addLog("الخطوة 2: جاري إرسال طلب إنشاء البطاقة السحابية إلى WalletWallet...");
                const passPayload = {
                    barcodeValue: phone,
                    barcodeFormat: "QR",
                    logoText: "HAJIB SOFT | حاجب سوفت ",
                    colorPreset: "blue",
                    color: "#6988ec",
                    logoURL: LOGO_BASE64, 
                    iconURL: ICON_BASE64,
                    stripURL: STRIP_BASE64,
                    primaryFields: [
                        { label: "العميل | customer", value: name }
                    ],
                    secondaryFields: [
                        { label: "عدد النقاط", value: "0" },
                        { label: "حالة الهدية", value: "اجمع النقاط للحصول على مكافأتك" }
                    ],
                    backFields: [
                        { label: "جميع الحقوق محفوظة لمنصة حاجب سوفت", value: "hajib soft 2026" },
                        { label: "Notifications", value: "أهلاً بك في برنامج الولاء", changeMessage: "%@" }
                    ]
                };

                const walletResponse = await fetch("https://api.walletwallet.dev/api/passes", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${WALLET_API_KEY}`
                    },
                    body: JSON.stringify(passPayload)
                });

                if (!walletResponse.ok) {
                    const errorText = await walletResponse.text();
                    throw new Error(`خطأ من خادم البطاقات: ${errorText}`);
                }

                const walletData = await walletResponse.json();
                addLog("تم استقبال بيانات البطاقة بنجاح من WalletWallet. الرقم التسلسلي: " + walletData.serialNumber);

                // 3. إدراج بيانات العميل الجديد في الـ Supabase
                addLog("الخطوة 3: جاري حفظ بيانات العميل والبطاقة في قاعدة البيانات (Supabase)...");
                const { data: newMember, error: insertError } = await supabaseClient
                    .from('loyalty_members')
                    .insert({
                        phone_number: phone,
                        name: name,
                        points: 0,
                        serial_number: walletData.serialNumber,
                        share_url: walletData.shareUrl
                    })
                    .select()
                    .single();

                if (insertError) {
                    throw new Error("فشل إدخال البيانات في Supabase: " + insertError.message);
                }

                addLog("تم حفظ بيانات العميل في قاعدة البيانات بنجاح!");

                // 4. إظهار رابط تحميل كارت المحفظة للعميل
                document.getElementById('wallet-download-link').href = newMember.share_url;
                document.getElementById('download-section').classList.remove('hidden');
                addLog("تم إظهار زر تحميل البطاقة السحابية للمستخدم.");
                alert("تم إنشاء حسابك وتجهيز البطاقة بنجاح!");

            } catch (err) {
                addLog("حدث خطأ أثناء العملية: " + err.message, true);
                alert("خطأ: " + err.message);
            }
        }
    </script>
