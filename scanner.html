<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاجب سوفت | بوابة الموظف ومسح البطاقات</title>
    <!-- استدعاء Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- مكتبة قارئ الكاميرا -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- استدعاء مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 w-full max-w-xl">
        <h2 class="text-2xl font-bold text-center text-gray-900 mb-6">مسح بطاقة العميل وإضافة النقاط</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <!-- البحث اليدوي برقم الجوال -->
            <div class="space-y-3">
                <h3 class="text-sm font-bold text-gray-700">البحث اليدوي برقم الجوال</h3>
                <div class="flex gap-2">
                    <input type="tel" id="search-phone-input" placeholder="مثال: 0512345678" class="flex-1 px-4 py-2 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 transition text-sm">
                    <button onclick="searchMemberByPhone()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl font-semibold text-sm transition">بحث</button>
                </div>
            </div>
            
            <!-- قارئ الكاميرا التلقائي -->
            <div class="space-y-3 flex flex-col justify-end">
                <h3 class="text-sm font-bold text-gray-700">المسح التلقائي (كاميرا الـ QR)</h3>
                <button onclick="startQRScanner()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-3 rounded-xl font-semibold text-sm transition">
                    فتح كاميرا الـ QR 📷
                </button>
            </div>
        </div>

        <!-- حاوية كاميرا القارئ للباركود -->
        <div id="qr-reader-container" class="hidden border rounded-xl overflow-hidden mb-6 bg-black relative max-w-sm mx-auto">
            <div id="qr-reader" class="w-full"></div>
            <button onclick="stopQRScanner()" class="absolute top-2 right-2 bg-red-600 text-white text-xs px-2 py-1 rounded">إغلاق الكاميرا</button>
        </div>

        <!-- عرض معلومات العميل وإدخال النقاط الجديدة -->
        <div id="member-info-panel" class="hidden bg-gray-50 border border-gray-200/50 rounded-xl p-6 mt-6 space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <div>
                    <p class="text-xs text-gray-400">اسم العميل المسجل</p>
                    <h4 id="panel-member-name" class="text-lg font-bold text-gray-900">-</h4>
                </div>
                <div class="text-left">
                    <p class="text-xs text-gray-400">النقاط الحالية</p>
                    <span id="panel-member-points" class="inline-block bg-blue-100 text-blue-800 text-lg font-bold px-3 py-1 rounded-lg">0</span>
                </div>
            </div>
            
            <!-- حقول مخفية مؤقتاً لتخزين معلومات العميل المختار -->
            <input type="hidden" id="panel-serial-number">
            <input type="hidden" id="panel-current-points">
            <input type="hidden" id="panel-member-name-hidden">

            <div class="flex flex-col sm:flex-row items-center gap-3">
                <div class="w-full sm:flex-1">
                    <label class="block text-xs font-semibold text-gray-500 mb-1">النقاط المراد إضافتها للرصيد</label>
                    <input type="number" id="add-points-amount" value="1" min="1" class="w-full px-4 py-2 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 transition">
                </div>
                <div class="w-full sm:w-auto flex items-end justify-end h-full pt-5">
                    <button onclick="addPointsToMember()" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-6 rounded-xl shadow-md transition">
                        تحديث وإرسال إشعار فوري 🔔
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://bigisnpdoqxmpjwpbncv.supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_6ZtAL8lRYdreWg4Xhn6zLA_7-PwGvPJ"; 
        const WALLET_API_KEY = "ww_live_d725637056c71ad72de934242e861523";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let html5QrScanner = null;

        // دالة بدء تشغيل الكاميرا ومسح الكود
        function startQRScanner() {
            document.getElementById('qr-reader-container').classList.remove('hidden');
            html5QrScanner = new Html5Qrcode("qr-reader");
            html5QrScanner.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                (decodedText) => {
                    stopQRScanner();
                    fetchMemberDetailsByPhone(decodedText);
                },
                (errorMessage) => { }
            ).catch(err => {
                alert("لم يتم العثور على كاميرا صالحة: " + err);
                stopQRScanner();
            });
        }

        function stopQRScanner() {
            if (html5QrScanner) {
                html5QrScanner.stop().then(() => {
                    document.getElementById('qr-reader-container').classList.add('hidden');
                }).catch(() => {});
                html5QrScanner = null;
            }
        }

        // دالة البحث اليدوي برقم الجوال
        function searchMemberByPhone() {
            const phone = document.getElementById('search-phone-input').value;
            if (!phone) return alert("يرجى إدخال رقم الجوال للبحث مسبقاً");
            fetchMemberDetailsByPhone(phone);
        }

        // استدعاء بيانات العميل من قاعدة البيانات
        async function fetchMemberDetailsByPhone(phone) {
            try {
                const { data, error } = await supabaseClient
                    .from('loyalty_members')
                    .select('*')
                    .eq('phone_number', phone)
                    .maybeSingle();

                if (error) throw error;

                if (data) {
                    document.getElementById('panel-member-name').textContent = data.name;
                    document.getElementById('panel-member-name-hidden').value = data.name;
                    document.getElementById('panel-member-points').textContent = data.points;
                    document.getElementById('panel-current-points').value = data.points;
                    document.getElementById('panel-serial-number').value = data.serial_number;
                    document.getElementById('member-info-panel').classList.remove('hidden');
                } else {
                    alert("لم يتم العثور على عميل مسجل بهذا الرقم.");
                }
            } catch (err) {
                alert("حدث خطأ أثناء الاتصال بقاعدة البيانات: " + err.message);
            }
        }

        // إضافة نقاط وإرسال التحديث لـ WalletWallet ليظهر فوراً على شاشة هاتف العميل كإشعار
        async function addPointsToMember() {
            const serialNumber = document.getElementById('panel-serial-number').value;
            const currentPoints = Number(document.getElementById('panel-current-points').value);
            const pointsToAdd = Number(document.getElementById('add-points-amount').value);
            const name = document.getElementById('panel-member-name-hidden').value;

            if (!serialNumber) return alert("حدث خطأ في تحديد بيانات العميل.");

            const newPoints = currentPoints + pointsToAdd;

            try {
                // 1. تحديث قاعدة البيانات في السوبابيس بالنقاط الجديدة
                const { error: dbError } = await supabaseClient
                    .from('loyalty_members')
                    .update({ points: newPoints })
                    .eq('serial_number', serialNumber);

                if (dbError) throw dbError;

                // 2. إرسال التحديث التلقائي لـ WalletWallet ليحدث الكارت في هاتف العميل
                const updatePayload = {
                    primaryFields: [
                        { label: "العميل | customer", value: name }
                    ],
                    secondaryFields: [
                        { 
                            label: "عدد النقاط", 
                            value: String(newPoints),
                            changeMessage: "تم إضافة نقاط جديدة! رصيدك الحالي هو: %@" // الرسالة التي تظهر في إشعار الهاتف
                        },
                        { 
                            label: "حالة الهدية", 
                            value: newPoints >= 10 ? "مبروك! تستحق الهدية الآن 🎉" : "متبقي القليل فقط" 
                        }
                    ]
                };

                const response = await fetch(`https://api.walletwallet.dev/api/passes/${serialNumber}`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${WALLET_API_KEY}`
                    },
                    body: JSON.stringify(updatePayload)
                });

                if (!response.ok) {
                    throw new Error("فشل إرسال التحديث لـ WalletWallet لتحديث شاشة الهاتف.");
                }

                // تحديث القيم الظاهرة على شاشة الموظف
                document.getElementById('panel-member-points').textContent = newPoints;
                document.getElementById('panel-current-points').value = newPoints;
                alert(`تم تحديث النقاط بنجاح! النقاط الجديدة للعميل هي: ${newPoints} وتم إرسال إشعار فوري لهاتفه.`);

            } catch (err) {
                alert("خطأ: " + err.message);
            }
        }
    </script>
</body>
</html>
