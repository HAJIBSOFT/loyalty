<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاجب سوفت | بطاقة الولاء الرقمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-3xl shadow-xl shadow-slate-100 border border-slate-100 p-8 w-full max-w-md">
        <div class="text-center mb-8">
            <div class="w-16 h-16 rounded-2xl bg-indigo-600 flex items-center justify-center text-white font-extrabold text-2xl mx-auto mb-4 shadow-lg shadow-indigo-200">ح</div>
            <h1 class="text-2xl font-bold text-slate-900">HAJIB SOFT | حاجب سوفت</h1>
            <p class="text-slate-500 text-sm mt-2">انضم لبرنامج الولاء واجمع النقاط للحصول على مكافآت قيمة</p>
            <div class="mt-3 inline-block bg-indigo-50 text-indigo-700 text-xs font-semibold px-3 py-1 rounded-full">
                المستهدف الحالي: <span id="target-text">..</span> نقاط للهدية 🎉
            </div>
        </div>
        
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">الاسم الكامل</label>
                <input type="text" id="cust-name" placeholder="أدخل اسمك الكريم" class="w-full px-4 py-3.5 rounded-2xl border border-slate-200 focus:outline-none focus:ring-4 focus:ring-indigo-100 focus:border-indigo-600 transition text-right text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">رقم الجوال</label>
                <input type="tel" id="cust-phone" placeholder="05xxxxxxxx" class="w-full px-4 py-3.5 rounded-2xl border border-slate-200 focus:outline-none focus:ring-4 focus:ring-indigo-100 focus:border-indigo-600 transition text-left text-sm" dir="ltr">
            </div>
            <button type="button" onclick="registerUser()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-2xl shadow-lg shadow-indigo-200 transition-all">
                إصدار بطاقة الولاء السحابية
            </button>
        </div>

        <div id="download-section" class="hidden mt-8 text-center space-y-4 border-t pt-6 border-slate-100">
            <div class="inline-flex p-3 bg-green-50 rounded-full text-green-600">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
            </div>
            <h3 class="text-lg font-bold text-slate-900">تم إنشاء بطاقتك بنجاح!</h3>
            <p class="text-xs text-slate-500">اضغط على الزر أدناه لحفظ البطاقة في محفظة جوالك مباشرة والبدء بجمع النقاط</p>
            <a id="wallet-download-link" href="#" target="_blank" class="inline-flex w-full items-center justify-center bg-black hover:bg-slate-900 text-white font-semibold py-3.5 px-6 rounded-2xl gap-3 transition shadow-md">
                <span>إضافة إلى محفظة الهاتف 📱</span>
            </a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://bigisnpdoqxmpjwpbncv.supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_6ZtAL8lRYdreWg4Xhn6zLA_7-PwGvPJ"; 
        const WALLET_API_KEY = "ww_live_d725637056c71ad72de934242e861523";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const LOGO_URL = "https://bigisnpdoqxmpjwpbncv.supabase.co/storage/v1/object/public/pass-assets/logo.png";
        const ICON_URL = "https://bigisnpdoqxmpjwpbncv.supabase.co/storage/v1/object/public/pass-assets/icon.png";
        const STRIP_URL = "https://bigisnpdoqxmpjwpbncv.supabase.co/storage/v1/object/public/pass-assets/strip.png";

        let targetPoints = 10;

        async function loadTargetSettings() {
            try {
                const { data } = await supabaseClient.from('app_settings').select('points_target').eq('id', 'config').maybeSingle();
                if (data) {
                    targetPoints = data.points_target;
                    document.getElementById('target-text').textContent = targetPoints;
                }
            } catch (err) { }
        }

        window.onload = loadTargetSettings;

        async function registerUser() {
            const name = document.getElementById('cust-name').value;
            const phone = document.getElementById('cust-phone').value;

            if (!name || !phone) return alert("يرجى تعبئة جميع الحقول.");

            try {
                const { data: existingUser, error: checkError } = await supabaseClient
                    .from('loyalty_members')
                    .select('*')
                    .eq('phone_number', phone)
                    .maybeSingle();

                if (checkError) throw checkError;

                if (existingUser) {
                    alert("أنت مسجل مسبقاً معنا! تفضل بتحميل بطاقتك.");
                    document.getElementById('wallet-download-link').href = existingUser.share_url;
                    document.getElementById('download-section').classList.remove('hidden');
                    return;
                }

                // هيكلة البطاقة مطابقة تماماً لطلبك الأول والنهائي [1]
                const passPayload = {
                    barcodeValue: phone,
                    barcodeFormat: "QR",
                    logoText: "HAJIB SOFT | حاجب سوفت ",
                    organizationName: "HAJIB SOFT ",
                    colorPreset: "blue",
                    color: "#6988ec",
                    logoURL: LOGO_URL, 
                    iconURL: ICON_URL,
                    stripURL: STRIP_URL,
                    primaryFields: [
                        { label: "العميل | custmer", value: name }
                    ],
                    secondaryFields: [
                        { label: "عدد النقاط ", value: "0" },
                        { label: "حالة الهدية ", value: "اجمع النقاط للحصول على مكافأتك" }
                    ],
                    backFields: [
                        { label: "جميع الحقوق محفوظة لمنصة حاجب سوفت", value: "hajib soft 2026" },
                        { label: "Notifications", value: "كيفك", changeMessage: "%@" }
                    ]
                };

                const walletResponse = await fetch("https://api.walletwallet.dev/api/passes", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${WALLET_API_KEY}`
                    },
                    body: JSON.stringify(passPayload)
                });

                if (!walletResponse.ok) {
                    const errorText = await walletResponse.text();
                    throw new Error(`خطأ من خادم البطاقات: ${errorText}`);
                }

                const walletData = await walletResponse.json();

                const { data: newMember, error: insertError } = await supabaseClient
                    .from('loyalty_members')
                    .insert({
                        phone_number: phone,
                        name: name,
                        points: 0,
                        serial_number: walletData.serialNumber,
                        share_url: walletData.shareUrl
                    })
                    .select()
                    .single();

                if (insertError) throw insertError;

                document.getElementById('wallet-download-link').href = newMember.share_url;
                document.getElementById('download-section').classList.remove('hidden');
                alert("تم إنشاء حسابك وتجهيز البطاقة بنجاح!");

            } catch (err) {
                alert("خطأ: " + err.message);
            }
        }
    </script>
</body>
</html>
